services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evhunter
      POSTGRES_PASSWORD: evhunter
      POSTGRES_DB: evhunter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://evhunter:evhunter@postgres:5432/evhunter
      REDIS_URL: redis://redis:6379
      USE_MOCK_DATA: "true"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-change-in-production
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
